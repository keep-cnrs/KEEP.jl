name: jtcam-tex

# Paper build for applications/jtcam-tex.
#   compile  : on every push / PR that touches the paper, compile main.tex from the committed
#              figs/ and tables/ and upload main.pdf.
#   figures  : on manual dispatch or a tag, regenerate figs/ and tables/ with main.jl (fast=true
#              for a quick smoke test of the workflow) and compile the paper from them.
#   web      : web version (applications/jtcam-tex/web, see web/PLAN.md). After `figures` on a
#              dispatch with fast=false or a tag: checks the regenerated tables against the
#              committed ones, builds the site from the regenerated results and deploys it to
#              the jtcam/ folder of gh-pages. On a PR, or a fast dispatch: build only, from the
#              committed results (fast) or the smoke-test ones, uploaded as an artifact.
# Committing regenerated files stays a manual step (download the artifact).

on:
  push:
    branches:
      - main
    tags: '*'
    paths:
      - 'applications/jtcam-tex/**'
      - '.github/workflows/jtcam-tex.yml'
  pull_request:
    paths:
      - 'applications/jtcam-tex/**'
      - 'src/Optimization.jl'
      - '.github/workflows/jtcam-tex.yml'
  workflow_dispatch:
    inputs:
      fast:
        description: 'Fast mode: reduced iteration limits and grids (smoke test, not the paper results)'
        type: boolean
        default: true
      check:
        description: 'Web: fail if the regenerated tables differ from the committed ones (off only for a preview while the committed tables lag behind the code)'
        type: boolean
        default: true

defaults:
  run:
    working-directory: applications/jtcam-tex

jobs:
  figures:
    # heavy: only on manual dispatch or on a tag
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13.4'  # same as applications/jtcam-tex/Manifest.toml
      - uses: julia-actions/cache@v2
      - name: System packages (latex + dvipng for the math labels of the Plots figures, Libertine font)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-fonts-extra fonts-linuxlibertine dvipng
      - name: Instantiate
        run: julia --project=. -e 'import Pkg; Pkg.instantiate()'
      - name: Regenerate figures and tables
        env:
          GKSwstype: '100'
        run: julia --project=. main.jl ${{ (github.event_name == 'workflow_dispatch' && inputs.fast) && '--fast' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: jtcam-tex-figs-tables
          path: |
            applications/jtcam-tex/figs
            applications/jtcam-tex/tables

  compile:
    needs: figures
    # run after `figures` when it ran, and alone otherwise
    if: ${{ !cancelled() && (needs.figures.result == 'success' || needs.figures.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the regenerated figures and tables
        if: needs.figures.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: jtcam-tex-figs-tables
          path: applications/jtcam-tex
      - name: TeX Live
        # the package list is a first guess: adjust it from the first run's missing-file errors
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended \
            texlive-fonts-extra texlive-science texlive-publishers texlive-bibtex-extra \
            texlive-pictures texlive-plain-generic biber latexmk
      - name: Compile
        run: latexmk -pdf -interaction=nonstopmode -outdir="$RUNNER_TEMP/build" main.tex
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jtcam-tex-pdf
          path: |
            ${{ runner.temp }}/build/main.pdf
            ${{ runner.temp }}/build/main.log

  web:
    needs: figures
    if: ${{ !cancelled() && (needs.figures.result == 'success' || (needs.figures.result == 'skipped' && github.event_name == 'pull_request')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # deploydocs pushes to gh-pages
    concurrency:
      group: jtcam-web-${{ github.ref }}
      cancel-in-progress: false
    env:
      # deploy the full results only (dispatch with fast=false, or a tag)
      DEPLOY: ${{ (github.event_name == 'workflow_dispatch' && !inputs.fast) || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
      - name: Use the regenerated figures and tables
        if: needs.figures.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: jtcam-tex-figs-tables
          path: applications/jtcam-tex
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13.4'
      - uses: julia-actions/cache@v2
      - name: Check the regenerated tables against the committed ones
        if: needs.figures.result == 'success' && env.DEPLOY == 'true'
        run: julia web/check_results.jl || [ "${{ github.event_name == 'workflow_dispatch' && !inputs.check }}" = "true" ]
      - name: TeX Live (main.aux for the numbering, TikZ figures) and pdftocairo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended \
            texlive-fonts-extra texlive-science texlive-publishers texlive-bibtex-extra \
            texlive-pictures texlive-plain-generic biber latexmk poppler-utils
      - name: Instantiate
        run: julia --project=web -e 'import Pkg; Pkg.instantiate()'
      - name: Build the site${{ env.DEPLOY == 'true' && ' and deploy it to gh-pages/jtcam' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JTCAM_WEB_DEVBRANCH: ${{ github.ref_name }}
        run: julia --project=web web/make.jl ${{ env.DEPLOY == 'true' && '--deploy' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: jtcam-tex-web
          path: applications/jtcam-tex/web/build
